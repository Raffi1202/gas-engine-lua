name: Feature request
description: An idea or an improvement for Gas Engine ECU or Gas Engine Carb.
labels: ["enhancement"]
body:
  - type: dropdown
    id: widget
    attributes:
      label: Widget
      options: ["Gas Engine ECU", "Gas Engine Carb", "both"]
    validations: { required: true }
  - type: textarea
    id: wunsch
    attributes:
      label: What would you like?
    validations: { required: true }
  - type: textarea
    id: wozu
    attributes:
      label: Why? Which model, which sensors?
